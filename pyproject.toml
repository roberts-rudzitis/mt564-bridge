[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mt564-bridge"
version = "0.2.0"
description = "Converts SWIFT MT564 corporate action notifications to ISO 20022 seev.031 XML, validates the result against the XSD, and reports what was mapped and what was dropped."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["lxml>=5.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
mt564-bridge = "mt564_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--cov=mt564_bridge --cov-report=term-missing"
