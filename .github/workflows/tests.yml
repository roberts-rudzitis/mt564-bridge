# Runs the test suite on Linux and Windows for every supported Python version.
# The official seev.031 XSD is downloaded first, so the samples are validated against it in CI.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Download the official seev.031.001.16 XSD
        run: >-
          curl -fsSL -A "Mozilla/5.0" -o schemas/seev.031.001.16.xsd
          https://www.iso20022.org/sites/default/files/documents/messages/seev/schemas/seev.031.001.16.xsd
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests (including validation of every sample against the XSD)
        run: pytest
